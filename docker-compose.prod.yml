# Production overlay — adds Caddy in front for automatic HTTPS on a real
# domain, and stops publishing the app's port directly to the internet
# (only Caddy is reachable from outside; it talks to `app` over the
# private compose network).
#
# Use together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Before running: point your domain's DNS A record at this server's IP,
# put that same domain in Caddyfile, and set TRUST_PROXY=true in .env
# (Caddy is now the reverse proxy that .env's TRUST_PROXY comment refers to).
services:
  app:
    ports: []   # override the base file's "3000:3000" — only Caddy is public now
    deploy:
      resources:
        limits:
          # Set MEM_LIMIT in your .env to match your EC2 instance.
          # Leave ~1.5GB headroom for OS + Caddy + restart burst.
          # Sizing guide (MAX_CONCURRENT_WHATSAPP_SESSIONS in .env controls Chrome):
          #
          #   Instance  | RAM  | MEM_LIMIT | Max WA sessions
          #   t3.medium |  4GB |    2.5G   |  7  (≈7 × 250MB = 1.75GB Chrome)
          #   t3.large  |  8GB |    6G     | 19  (≈19 × 250MB = 4.75GB Chrome)
          #   t3.xlarge | 16GB |   14G     | 43  (≈43 × 250MB = 10.75GB Chrome)
          #
          # Without this set the container is unconstrained — Docker will
          # OOM-kill it at OS level without warning instead of a controlled 503.
          memory: ${MEM_LIMIT:-2.5G}
    # memswap_limit = memory + swap available. Setting it equal to memory
    # disables swap for this container, which is safer: swap hides OOM
    # conditions and causes Chrome to thrash rather than fail cleanly.
    # If you experience OOM kills during Chrome startup bursts, set
    # SWAP_LIMIT in .env to memory + 1G (e.g. 3.5G for a 2.5G MEM_LIMIT).
    memswap_limit: ${SWAP_LIMIT:-2.5G}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # Daily PostgreSQL backup at 02:00 UTC with 14-day retention.
  # Writes gzip dumps to the backup volume (host path configurable via
  # BACKUP_HOST_DIR in your .env; defaults to ./backups/postgres on the host).
  # The backup container has read-only access to DATABASE_URL — it never
  # touches the app container or the app data volumes.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PGPASSWORD_FILE=/run/secrets/pg_password
    volumes:
      - ./scripts/backup-postgres.sh:/backup.sh:ro
      - backup-data:/backups
    # ofelia/crond approach: use the alpine built-in crond.
    # Runs at 02:00 UTC daily. Keeps the last 14 days and deletes older files.
    entrypoint: >
      sh -c "
        echo '0 2 * * * DATABASE_URL=$$DATABASE_URL /backup.sh /backups && find /backups -name \"*.sql.gz\" -mtime +14 -delete' | crontab - &&
        crond -f -l 6
      "

volumes:
  caddy-data:
  caddy-config:
  backup-data:
